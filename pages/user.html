<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Coffee</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-4 mb-2 mb-lg-0 ms-auto gap-4" id="navBar">
            <li class="nav-item nav-tab">
              <a class="nav-link active" href="../index.html"
                ><i class="bi bi-house"></i> Home</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container my-4">
      <div class="row g-4">
        <div class="col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-2">
              <div
                class="nav flex-column nav-pills"
                id="accountTabs"
                role="tablist"
                aria-orientation="vertical"
              >
                <button
                  class="nav-link active text-start d-flex align-items-center gap-2"
                  id="tab-info"
                  data-bs-toggle="pill"
                  data-bs-target="#pane-info"
                  type="button"
                  role="tab"
                >
                  <i class="bi bi-info-circle"></i> Account Info
                </button>

                <button
                  class="nav-link text-start d-flex align-items-center gap-2"
                  id="tab-actions"
                  data-bs-toggle="pill"
                  data-bs-target="#pane-actions"
                  type="button"
                  role="tab"
                >
                  <i class="bi bi-shield-lock"></i> Account Actions
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-9">
          <div class="tab-content" id="accountTabsContent">
            <div
              class="tab-pane fade show active"
              id="pane-info"
              role="tabpanel"
            >
              <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent fw-bold">
                  Account Overview
                </div>
                <div class="card-body" id="user-info"></div>
              </div>
            </div>

            <div class="tab-pane fade" id="pane-actions" role="tabpanel">
              <div class="card border-0 shadow-sm mb-4 v-stack gap-2 p-3">
                <div class="card-header bg-transparent fw-bold">Security</div>
                <div
                  class="card-body d-flex align-items-center justify-content-between"
                >
                  <div>
                    <h6 class="mb-1">Password</h6>
                    <p class="text-muted small mb-0">
                      Manage and update your account password.
                    </p>
                  </div>
                  <button
                    class="btn btn-outline-primary btn-sm"
                    id="btnChangePassword"
                  >
                    <i class="bi bi-key me-1"></i> Update
                  </button>
                </div>

                <div class="card border-danger shadow-sm">
                  <div class="card-header bg-danger text-white fw-bold">
                    Danger Zone
                  </div>
                  <div
                    class="card-body d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <h6 class="mb-1 text-danger">Delete Account</h6>
                      <p class="text-muted small mb-0">
                        Permanently erase your account data. This action cannot
                        be undone.
                      </p>
                    </div>
                    <button class="btn btn-danger btn-sm" id="btnDeleteAccount">
                      Delete Account
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../static/js/user.js"></script>
  </body>
</html>
