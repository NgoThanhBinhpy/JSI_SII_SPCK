<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Coffee</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-4 mb-2 mb-lg-0 ms-auto gap-4" id="navBar">
            <li class="nav-item nav-tab">
              <a class="nav-link active" href="../index.html"
                ><i class="bi bi-house"></i> Home</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">
            <i class="bi bi-receipt me-2 text-primary"></i>My Orders
          </h2>
          <p class="text-muted mb-0">
            View and manage your recent purchase history.
          </p>
        </div>
        <a href="/" class="btn btn-primary"
          ><i class="bi bi-cart-plus me-1"></i> Continue Shopping</a
        >
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
              <div
                class="bg-primary-subtle text-primary p-3 rounded-circle me-3"
              >
                <i class="bi bi-bag-check fs-4"></i>
              </div>
              <div>
                <h6 class="text-muted mb-0">Total Orders</h6>
                <h4 class="fw-bold mb-0" id="total-orders-count">0</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
              <div
                class="bg-warning-subtle text-warning p-3 rounded-circle me-3"
              >
                <i class="bi bi-hourglass-split fs-4"></i>
              </div>
              <div>
                <h6 class="text-muted mb-0">Processing</h6>
                <h4 class="fw-bold mb-0" id="processing-orders-count">0</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
              <div
                class="bg-success-subtle text-success p-3 rounded-circle me-3"
              >
                <i class="bi bi-truck fs-4"></i>
              </div>
              <div>
                <h6 class="text-muted mb-0">Delivered</h6>
                <h4 class="fw-bold mb-0" id="delivered-orders-count">0</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-4" id="orders-container"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../static/js/orders.js"></script>
  </body>
</html>
