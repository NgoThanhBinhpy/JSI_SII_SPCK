<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - EduSite</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      #empty-cart-msg {
        display: none;
      }

      #cart-body:empty + #empty-cart-msg,
      body:has(#cart-body:empty) #empty-cart-msg {
        display: block !important;
      }
    </style>
  </head>
  <body class="bg-light p-2">
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">
          <i class="bi bi-cart3 me-2"></i>Your Shopping Cart
        </h2>
        <a href="../index.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Continue Shopping
        </a>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div
              class="card-body p-0 d-flex gap-2 flex-column"
              id="cart-body"
            ></div>
            <div id="empty-cart-msg" class="text-center py-5">
              <i class="bi bi-cart-x text-muted display-1"></i>
              <h5 class="mt-3 text-secondary">Your cart is currently empty</h5>
              <p class="text-muted small">
                Looks like you haven't added any books yet.
              </p>
              <a href="./index.html" class="btn btn-primary btn-sm mt-2"
                >Browse Books</a
              >
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card border-0 shadow-sm sticky-top" style="top: 20px">
            <div class="card-body p-4">
              <h5 class="fw-bold mb-3">Order Summary</h5>

              <div class="d-flex justify-content-between mb-2 text-muted">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0.00 USD</span>
              </div>
              <div class="d-flex justify-content-between mb-3 text-muted">
                <span>Estimated Tax (5%)</span>
                <span id="cart-tax">$0.00 USD</span>
              </div>

              <hr />

              <div class="d-flex justify-content-between mb-4">
                <span class="fw-bold fs-5">Total</span>
                <span id="cart-total" class="fw-bold fs-5 text-primary"
                  >$0.00 USD</span
                >
              </div>

              <button
                id="checkout-btn"
                class="btn btn-primary w-100 py-2 fw-semibold"
              >
                <i class="bi bi-credit-card me-2"></i>Proceed to Checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../static/js/cart.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
      integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
