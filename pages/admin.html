<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - EduSite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light p-4">
    <div class="container bg-white p-4 rounded shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Dashboard</h2>
        <a href="../index.html" class="btn btn-outline-secondary"
          >Back to Site</a
        >
      </div>

      <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item">
          <button
            class="nav-link active"
            id="orders-tab"
            data-bs-toggle="tab"
            data-bs-target="#orders-pane"
            type="button"
          >
            Manage Orders
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="products-tab"
            data-bs-toggle="tab"
            data-bs-target="#products-pane"
            type="button"
          >
            Manage Products
          </button>
        </li>
      </ul>

      <div class="tab-content pt-3" id="adminTabsContent">
        <div class="tab-pane fade show active" id="orders-pane">
          <h4>Customer Orders</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer Email</th>
                  <th>Product Title</th>
                  <th>Total Value</th>
                  <th>Total Amount</th>
                  <th>Current Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="orders-table-body"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-pane fade" id="products-pane">
          <div class="d-flex justify-content-between mb-3">
            <h4>Product Catalog</h4>
            <div class="input-group w-auto">
              <button class="btn btn-primary" type="button" id="add-books-btn">
                Add books
              </button>
              <input
                type="number"
                id="add-books-quantity"
                class="form-control text-center"
                value="1"
                max="100"
                min="1"
                style="max-width: 80px"
              />
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Book&nbsp;ID</th>
                  <th>Title</th>
                  <th>Publisher</th>
                  <th>Published&nbsp;Date</th>
                  <th>Authors</th>
                  <th>Price</th>
                  <th>Catergories</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="products-table-body">
                <!-- Products injected dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../static/js/admin.js"></script>
  </body>
</html>
