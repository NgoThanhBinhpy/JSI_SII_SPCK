<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - EduSite</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Coffee</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-4 mb-2 mb-lg-0 ms-auto gap-4" id="navBar">
            <li class="nav-item nav-tab">
              <a class="nav-link active" href="../index.html"
                ><i class="bi bi-house"></i> Home</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container bg-body p-4 rounded shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Dashboard</h2>
        <a href="../index.html" class="btn btn-outline-secondary"
          >Back to Site</a
        >
      </div>

      <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item">
          <button
            class="nav-link active"
            id="orders-tab"
            data-bs-toggle="tab"
            data-bs-target="#orders-pane"
            type="button"
          >
            Manage Orders
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="products-tab"
            data-bs-toggle="tab"
            data-bs-target="#products-pane"
            type="button"
          >
            Manage Products
          </button>
        </li>
      </ul>

      <div class="tab-content pt-3" id="adminTabsContent">
        <div class="tab-pane fade show active" id="orders-pane">
          <h4 class="mb-3">Customer Orders</h4>
          <div class="row g-3" id="orders-container"></div>
        </div>

        <div class="tab-pane fade" id="products-pane">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Product Catalog</h4>
            <div class="input-group w-auto">
              <button class="btn btn-primary" type="button" id="add-books-btn">
                Add books
              </button>
              <input
                type="number"
                id="add-books-quantity"
                class="form-control text-center"
                value="1"
                max="100"
                min="1"
                style="max-width: 80px"
              />
            </div>
          </div>
          <div class="row g-3" id="products-container"></div>
        </div>
      </div>
    </div>

    <script type="module" src="../static/js/admin.js"></script>
  </body>
</html>
