<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-light p-2">
    <div
      class="card col-5 mx-auto mt-4 p-2 border-0 d-flex flex-column gap-2 bg-transparent"
    >
      <h3 class="mx-auto">Đăng nhập/Đăng kí</h3>
      <div class="input-group mb-3">
        <span class="input-group-text"
          ><i class="fa-solid fa-at text-secondary"></i
        ></span>
        <div class="form-floating">
          <input
            type="text"
            class="form-control"
            id="email-input"
            placeholder="Email"
          />
          <label for="email-input">Email</label>
        </div>
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text"
          ><i class="fa-solid fa-key text-secondary"></i
        ></span>
        <div class="form-floating">
          <input
            type="text"
            class="form-control"
            id="password-input"
            placeholder="Password"
          />
          <label for="password-input">Password</label>
        </div>
      </div>

      <div class="d-flex gap-2 mx-auto">
        <button class="btn btn-outline-info col-8 mx-auto" id="log-in-btn">
          Đăng nhập
        </button>
        <button class="btn btn-outline-info col-8 mx-auto" id="res-btn">
          Đăng kí
        </button>
      </div>

      <hr />
      <h5 class="mx-auto">Log in using other providers</h5>
      <div class="d-flex gap-2 justify-content-center">
        <button class="btn border-0 m-0" id="google-btn">
          <i class="fa-brands fa-google"></i>
        </button>
        <button class="btn border-0 m-0" id="github-btn">
          <i class="fa-brands fa-github"></i>
        </button>
      </div>
    </div>
    <script type="module" src="../static/js/auth.js"></script>
  </body>
</html>
