<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../static/css/index.css" />
  </head>
  <body class="bg-body d-flex flex-column min-vh-100">
    <main class="flex-grow-1">
      <form
        id="auth-form"
        class="card col-5 mx-auto mt-4 p-2 border-0 d-flex flex-column gap-2 bg-transparent needs-validation"
        novalidate
      >
        <h3 class="mx-auto">Sign in or Register</h3>
        <div class="input-group mb-3">
          <span class="input-group-text"
            ><i class="fa-solid fa-at text-secondary"></i
          ></span>
          <div class="form-floating">
            <input
              type="email"
              class="form-control"
              id="email-input"
              name="email"
              placeholder="Email"
              autocomplete="email"
              required
            />
            <label for="email-input">Email</label>
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>
          <div data-target="#email-input"></div>
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text"
            ><i class="fa-solid fa-key text-secondary"></i
          ></span>
          <div class="form-floating">
            <input
              type="password"
              class="form-control"
              id="password-input"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              minlength="8"
              maxlength="128"
              required
            />
            <label for="password-input">Password</label>
            <div class="invalid-feedback">
              Password must be at least 8 characters.
            </div>
          </div>
          <div data-target="#password-input"></div>
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text"
            ><i class="fa-solid fa-user text-secondary"></i
          ></span>
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="display-name-input"
              name="displayName"
              placeholder="Display name"
              maxlength="50"
              minlength="2"
            />
            <label for="display-name-input">Display name</label>
          </div>
          <div data-target="#display-name-input"></div>
        </div>

        <div class="d-flex gap-2 mx-auto justify-content-center col-md-6">
          <button
            type="button"
            class="btn btn-outline-info col-8 mx-auto"
            id="log-in-btn"
          >
            Sign in
          </button>
          <button
            type="button"
            class="btn btn-outline-info col-8 mx-auto"
            id="res-btn"
          >
            Register
          </button>
        </div>

        <hr />
        <h5 class="mx-auto">Sign in using other providers</h5>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn border-0 m-0" id="google-btn" type="button">
            <i class="fa-brands fa-google"></i>
          </button>
          <button class="btn border-0 m-0" id="github-btn" type="button">
            <i class="fa-brands fa-github"></i>
          </button>
        </div>
        <p class="mx-auto">
          Forgot your password? Reset your password
          <a href="#" id="reset-password">here</a>
        </p>
      </form>
    </main>

    <script type="module" src="../static/js/auth.js"></script>
  </body>
</html>
